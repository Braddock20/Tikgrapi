# Render blueprint — the free tier.
#
#   render blueprint launch
#
# or, from the Render dashboard: New → Blueprint → point it at this repo.
#
# The service fits in 512 MB because the browser is started only when a
# signed request needs it and released again when it goes idle.

services:
  - type: web
    name: tiktok-engine
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: BACKEND
        value: auto
      - key: SESSION_PATH
        value: /data/session.enc
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/engine.db
      - key: SESSION_RENEW_HOURS
        value: "6"
      - key: SESSION_VERIFY_ON_BOOT
        value: "true"
      - key: BROWSER_IDLE_SHUTDOWN_SECONDS
        value: "180"
      - key: BROWSER_MIN_FREE_MB
        value: "140"
      - key: MEMORY_LIMIT_MB
        value: "512"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: REQUEST_MIN_INTERVAL
        value: "2.5"
      - key: REQUEST_MAX_PER_HOUR
        value: "120"
      # Account-changing commands stay off until you mean it.
      - key: ALLOW_WRITE_OPS
        value: "false"
      # The session — the whole cookie header from the browser.
      - key: TIKTOK_SESSION
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true
      # The chat bot.
      - key: BOT_CHANNEL
        value: auto
      - key: BOT_MARKER
        value: "/"
      - key: BOT_POLL_INTERVAL
        value: "20"
      - key: WELCOME_ON_BOOT
        value: "true"
      # Set this when the bot should only answer you.
      - key: BOT_ALLOWED_AUTHORS
        sync: false
      # Uncomment to keep the free instance awake between visits.
      # - key: KEEPALIVE_ENABLED
      #   value: "true"
    disk:
      name: engine-data
      mountPath: /data
      sizeGB: 1
